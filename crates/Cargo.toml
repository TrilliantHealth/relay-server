[workspace]
resolver = "2"

members = [
    "relay",
    "y-sweet-core",
    "y-sign",
    "yrs-kvstore",
]

exclude = [
    "y-sweet-worker",
]

[profile.release]
opt-level = 'z'  # Optimize for size
lto = true       # Enable Link Time Optimization
codegen-units = 1 # Further size optimization
strip = true     # Strip symbols

[patch.crates-io]
rusty-s3 = { git = "https://github.com/dtkav/rusty-s3", branch = "main" }
yrs-kvstore = { path = "yrs-kvstore" }
# yrs 0.26.0 plus two patches not on crates.io, carried on our fork's
# thds/0.26.0-patched branch:
# 1. delete-set-loss when updates arrive out of causal order - the branch point
#    is dtkav/y-crdt@4adcaa6, which carries it
# 2. find_index out-of-range panic (ours). Upstream #647 fixed only the
#    past-the-end case, so the mid == 0 underflow is still live on their main.
yrs = { git = "https://github.com/petergaultney/y-crdt", rev = "4996719" }
